name: Build Android
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Use mobile web update if supplied
        shell: bash
        run: |
          if [ -f www.zip ]; then
            mkdir -p "$RUNNER_TEMP/qalam-web"
            unzip -q www.zip -d "$RUNNER_TEMP/qalam-web"
            test -f "$RUNNER_TEMP/qalam-web/index.html"
            cp -a "$RUNNER_TEMP/qalam-web/." www/
          fi
      - run: npm ci
      - run: npm run build
      - name: Android build and lint
        working-directory: android
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug bundleRelease lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-aab-unsigned
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint-reports
          path: android/app/build/reports/lint-results-*
